<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Стили -->
  <style>
    .node {
      fill: #fff;
      stroke: #333;
      stroke-width: 2;
      font-family: Arial, sans-serif;
      font-size: 14px;
      text-anchor: middle;
      cursor: pointer;
    }
    .node:hover {
      stroke: #007BFF;
      stroke-width: 3;
    }
    .layer-title {
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      fill: #333;
    }
    .arrow {
      stroke: #666;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrowhead);
    }
    .input {
      fill: #f0f8ff;
    }
    .conv {
      fill: #e6f3ff;
    }
    .flatten {
      fill: #f0fff0;
    }
    .dense {
      fill: #fff0f0;
    }
    .output {
      fill: #fffacd;
    }
  </style>

  <!-- Стрелка -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>

  <!-- Входной слой -->
  <rect x="50" y="200" width="120" height="60" rx="5" ry="5" class="node input" />
  <text x="110" y="235" class="layer-title">Input</text>
  <text x="110" y="250" font-size="12px" fill="#555">5×5×3</text>

  <!-- Conv2D (16 фильтров, 3×3, ReLU) -->
  <rect x="220" y="150" width="120" height="60" rx="5" ry="5" class="node conv" />
  <text x="280" y="185" class="layer-title">Conv2D</text>
  <text x="280" y="200" font-size="12px" fill="#555">16 фильтров, 3×3</text>
  <text x="280" y="215" font-size="12px" fill="#555">ReLU, padding='same'</text>
  <text x="280" y="230" font-size="12px" fill="#555">Выход: 5×5×16</text>

  <!-- Стрелка от Input к Conv2D -->
  <path d="M170 230 L220 230" class="arrow" />

  <!-- Conv2D (32 фильтра, 5×5, ReLU) -->
  <rect x="220" y="250" width="120" height="60" rx="5" ry="5" class="node conv" />
  <text x="280" y="285" class="layer-title">Conv2D</text>
  <text x="280" y="300" font-size="12px" fill="#555">32 фильтра, 5×5</text>
  <text x="280" y="315" font-size="12px" fill="#555">ReLU, padding='same'</text>
  <text x="280" y="330" font-size="12px" fill="#555">Выход: 5×5×32</text>

  <!-- Стрелка от первого Conv2D ко второму -->
  <path d="M340 200 L340 250 L220 250" class="arrow" />

  <!-- Flatten -->
  <rect x="400" y="200" width="120" height="60" rx="5" ry="5" class="node flatten" />
  <text x="460" y="235" class="layer-title">Flatten</text>
  <text x="460" y="250" font-size="12px" fill="#555">Выход: 800</text>

  <!-- Стрелка от Conv2D к Flatten -->
  <path d="M340 280 L400 280 L400 230" class="arrow" />

  <!-- Dense (16 нейронов, ReLU) -->
  <rect x="580" y="150" width="120" height="60" rx="5" ry="5" class="node dense" />
  <text x="640" y="185" class="layer-title">Dense</text>
  <text x="640" y="200" font-size="12px" fill="#555">16 нейронов, ReLU</text>
  <text x="640" y="215" font-size="12px" fill="#555">Выход: 16</text>

  <!-- Стрелка от Flatten к Dense -->
  <path d="M520 230 L580 230 L580 200" class="arrow" />

  <!-- Output (Softmax) -->
  <rect x="580" y="250" width="120" height="60" rx="5" ry="5" class="node output" />
  <text x="640" y="285" class="layer-title">Dense</text>
  <text x="640" y="300" font-size="12px" fill="#555">N классов, Softmax</text>
  <text x="640" y="315" font-size="12px" fill="#555">Выход: N</text>

  <!-- Стрелка от Dense к Output -->
  <path d="M700 200 L700 250 L580 250" class="arrow" />

  <!-- Заголовок -->
  <text x="400" y="50" font-size="20px" font-weight="bold" text-anchor="middle" fill="#333">CNN Architecture</text>
  <text x="400" y="70" font-size="14px" text-anchor="middle" fill="#666">(Patch-based Image Classification)</text>

  <!-- Легенда -->
  <rect x="50" y="400" width="100" height="40" rx="5" ry="5" class="node input" />
  <text x="100" y="425" font-size="12px" text-anchor="start" fill="#333">Input Layer</text>

  <rect x="200" y="400" width="100" height="40" rx="5" ry="5" class="node conv" />
  <text x="250" y="425" font-size="12px" text-anchor="start" fill="#333">Conv2D Layer</text>

  <rect x="350" y="400" width="100" height="40" rx="5" ry="5" class="node flatten" />
  <text x="400" y="425" font-size="12px" text-anchor="start" fill="#333">Flatten Layer</text>

  <rect x="500" y="400" width="100" height="40" rx="5" ry="5" class="node dense" />
  <text x="550" y="425" font-size="12px" text-anchor="start" fill="#333">Dense Layer</text>

  <rect x="650" y="400" width="100" height="40" rx="5" ry="5" class="node output" />
  <text x="700" y="425" font-size="12px" text-anchor="start" fill="#333">Output Layer</text>
</svg>
